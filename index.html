<!DOCTYPE html>
<html>
<head>
  <title>HDS Delivery Calculator</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f1a;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: #1b1b2f;
      padding: 20px;
      border-radius: 10px;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #00ffcc;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .result {
      margin-top: 15px;
      font-size: 18px;
      color: #00ffcc;
    }

    #orderForm {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>HDS Delivery Calculator</h2>

  <!-- Pickup -->
  <select id="pickup">
    <option>Mingora</option>
    <option>Saidu Sharif</option>
    <option>Kalam</option>
  </select>

  <!-- Dropoff -->
  <select id="dropoff">
    <option>Mingora</option>
    <option>Saidu Sharif</option>
    <option>Kalam</option>
  </select>

  <!-- Weight -->
  <select id="weight">
    <option value="1">1 kg</option>
    <option value="2">2 kg</option>
    <option value="3">3 kg</option>
    <option value="4">4 kg</option>
    <option value="5">5 kg</option>
  </select>

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="result"></div>

  <button id="confirmBtn" style="display:none;" onclick="showForm()">
    Confirm Order
  </button>

  <!-- ORDER FORM -->
  <div id="orderForm">

    <h3>Order Details</h3>

    <input id="sname" placeholder="Sender Name">
    <input id="sphone" placeholder="Sender Phone" type="tel">
    <input id="rname" placeholder="Receiver Name">
    <input id="rphone" placeholder="Receiver Phone" type="tel">

    <button id="submitBtn" onclick="submitOrder()">Submit Order</button>

  </div>

</div>

<script>
let totalPrice = 0;
let route = "";

function calculate() {
  let pickup = document.getElementById("pickup").value;
  let dropoff = document.getElementById("dropoff").value;
  let weight = parseInt(document.getElementById("weight").value);

  let base = (pickup === dropoff) ? 50 : 200;
  let weightCost = weight * 100;
  totalPrice = base + weightCost;
  route = pickup + " → " + dropoff;

  document.getElementById("result").innerText = "Total Price: " + totalPrice + " PKR";
  document.getElementById("confirmBtn").style.display = "block";
}

function showForm() {
  document.getElementById("orderForm").style.display = "block";
}

async function submitOrder() {
  let sname  = document.getElementById("sname").value.trim();
  let sphone = document.getElementById("sphone").value.trim();
  let rname  = document.getElementById("rname").value.trim();
  let rphone = document.getElementById("rphone").value.trim();

  // Basic validation
  if (!sname || !sphone || !rname || !rphone) {
    alert("⚠️ Please fill in all fields before submitting.");
    return;
  }

  let submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerText = "Submitting...";

  let formURL = "https://docs.google.com/forms/d/e/1FAIpQLSchW5ajPRLbZ56E-tsTJvO2yhD1YUSnbqMsfbQRMx77G1tYIg/formResponse";

  let formData = new URLSearchParams();
  formData.append("entry.1553337729", sname);
  formData.append("entry.1532037906", sphone);
  formData.append("entry.1192142703", rname);
  formData.append("entry.749953752",  rphone);
  formData.append("entry.1261770845", route);
  formData.append("entry.109221876",  totalPrice);

  try {
    await fetch(formURL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: formData.toString()
    });

    alert("✅ Order Submitted Successfully!\n\nRoute: " + route + "\nPrice: " + totalPrice + " PKR");

    // Reset form after successful submission
    document.getElementById("sname").value  = "";
    document.getElementById("sphone").value = "";
    document.getElementById("rname").value  = "";
    document.getElementById("rphone").value = "";
    document.getElementById("orderForm").style.display = "none";
    document.getElementById("confirmBtn").style.display = "none";
    document.getElementById("result").innerText = "";

  } catch (error) {
    alert("❌ Submission failed. Please check your connection and try again.");
    console.error("Fetch error:", error);
  }

  submitBtn.disabled = false;
  submitBtn.innerText = "Submit Order";
}
</script>

</body>
</html>
